[project]
name = "uaas-web"
version = "1.4.0"
description = "UTXO as a Service Python REST API"
requires-python = ">=3.12"
dependencies = [
    "toml==0.10.2",
    "fastapi==0.142.2",
    "fastapi-utils==0.8.0",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary,pool]==3.3.6",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "flake8==7.4.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "httpx==0.28.1",
    "types-toml==0.10.8.20260518",
    "types-requests==2.33.0.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring PostgreSQL (set UAAS_TEST_POSTGRES_URL)",
]
testpaths = ["python/tests"]
