[package]
name = "uaas"
version = "1.4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chain-gang = { git = "https://github.com/nchain-innovation/chain-gang.git", tag = "v0.11.2" }

serde = { version = "1.0.228", features =["derive"] }
toml = "1.1.2"
lazy_static = "1.5.0"
serde_json = "1.0.150"
mysql = "28.0.0"
# Postgres driver. Synchronous, matching the existing blocking mysql usage:
# the database work happens on the peer-manager thread and inside web::block,
# so an async client would force a restructure for no gain.
postgres = "0.19.14"
chrono = "0.4.45"
rand = "0.10.2"
hex = "0.4.3"
regex = "1.12.3"
retry = "2.2.0"
actix-web = { version = "4.14.0", features = ["macros"] }
tokio = { version = "1.52", features = ["signal", "macros"] }
log = { version = "0.4.33", features = ["max_level_trace", "release_max_level_warn"] }
simple_logger = "5.2.0"
anyhow = "1.0.102"

[features]
# Introduce random orphans into the download stream
rnd_orphans = []

# Declared here, not as an inner attribute, because the package now has two
# crates: the library and the binary. A `#![warn(...)]` in lib.rs would not
# cover main.rs, silently dropping this lint from the binary.
#
# `let _ = <iterator adapter>` is how the dead UTXO write path (CS-393) hid for
# two years: `let _ =` silences the whole `unused` lint group, `unused_must_use`
# and `map_unit_fn` included, so the build stayed clean while neither closure
# ran. This lint is the one that actually names it. It lives in
# `clippy::restriction`, which is deliberately opinionated and not meant to be
# enabled wholesale, so it is named one lint at a time rather than by group.
[lints.clippy]
let_underscore_must_use = "warn"
