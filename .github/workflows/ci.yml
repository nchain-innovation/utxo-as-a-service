name: CI
# The runner image is pinned, not `ubuntu-latest`. That label migrates to Ubuntu
# 26 between 19 October and 19 November 2026 (actions/runner-images#14748),
# which would move the OS under every build on a date nobody chose — including
# the Docker and containerd that back the postgres service containers below.
# Pinning decouples the upgrade from that date so it happens deliberately
# (CS-460; CS-442 and CS-444 did the same for the other four Rust repos).
#
# Keep the `cache-key` / `cache-suffix` values below in step with this. A cache
# key that does not name the image is restored across an image change, which is
# how CS-444's trial produced a convincing but false
# `unable to find library -lpython3.12` in chain-gang: a 24.04 cache carrying
# pyo3 output resolved against Python 3.12, landing on an image shipping 3.13.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-26.04
    services:
      # PostgreSQL is the engine the Rust service runs on now. There is no
      # MariaDB service in this job any more: nothing in the crate speaks it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    env:
      # Two databases, deliberately:
      #
      # * uaas_test_db  — the schema `cargo test` runs against, migrated below.
      # * uaas_db       — left untouched until the smoke test, so that step
      #                   exercises a migration from nothing through the shipped
      #                   binary rather than finding the work already done.
      #
      # Both are owned by the unprivileged `uaas` role rather than the
      # superuser, so a missing grant fails here rather than in a deployment.
      UAAS_TEST_POSTGRES_URL: postgresql://uaas:uaas-password@127.0.0.1:5432/uaas_test_db
      UAAS_SMOKE_POSTGRES_URL: postgresql://uaas:uaas-password@127.0.0.1:5432/uaas_db

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          # Scoped to the image: the action's default key carries the
          # architecture but not the OS version.
          cache-key: ubuntu-26.04

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config postgresql-client

      # Roles and databases only. The schema belongs to rust/migrations/ and is
      # applied by `uaas migrate` in the next step — creating tables here would
      # put the schema in two places, which is what CS-419 removed.
      - name: Initialize PostgreSQL
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -f init_database/postgres/01_roles_and_databases.sql
          # Not in the init script: that file is the production bootstrap and a
          # test database does not belong in it. Owned by `uaas` so the
          # migration tests can CREATE SCHEMA in it.
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE uaas_test_db OWNER uaas'

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: rust
        # --all-targets so test code is linted too; -D warnings so a finding
        # fails the build without relying on the RUSTFLAGS default that
        # setup-rust-toolchain happens to set.
        run: cargo clippy --all-targets -- -D warnings

      # Must precede `cargo test`. The tests that touch the database no longer
      # create their own tables — the migrations own the schema — so without
      # this they fail on a missing relation rather than skipping.
      - name: Apply migrations to the test database
        working-directory: rust
        run: cargo run --quiet -- migrate "$UAAS_TEST_POSTGRES_URL"

      - name: cargo test
        working-directory: rust
        run: cargo test

      # The tests call migrate::run directly. This runs the shipped binary end
      # to end against an unmigrated database, which is what a deploy actually
      # does, and asserts the schema version it leaves behind.
      - name: uaas migrate smoke test
        working-directory: rust
        run: |
          cargo run --quiet -- migrate "$UAAS_SMOKE_POSTGRES_URL"
          version=$(psql "$UAAS_SMOKE_POSTGRES_URL" -tAc "SELECT max(version) FROM schema_migration")
          # Compared against the files on disk rather than a literal, so adding
          # a migration does not silently leave this asserting a stale number.
          # mig01 already pins the file list to the embedded one.
          expected=$(ls migrations/*.sql | wc -l | tr -d ' ')
          echo "schema version: $version (expected $expected)"
          test "$version" = "$expected"
          # A second run must be a no-op, not an error.
          cargo run --quiet -- migrate "$UAAS_SMOKE_POSTGRES_URL"

  python:
    name: Python
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    env:
      # The name must contain "test": the integration helpers issue
      # unconditional DELETEs and refuse a database whose name does not.
      UAAS_TEST_POSTGRES_URL: postgresql://uaas:uaas-password@127.0.0.1:5432/uaas_test_db

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ubuntu-26.04

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-key: ubuntu-26.04

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize PostgreSQL
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -f init_database/postgres/01_roles_and_databases.sql
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE uaas_test_db OWNER uaas'

      # The Python integration tests no longer define their own schema — the
      # migrations own it, and the suite fails with an actionable message if it
      # has not been applied. Applied by the Rust binary, which is the only
      # thing that carries the migrations.
      - name: Apply migrations to the test database
        working-directory: rust
        run: cargo run --quiet -- migrate "$UAAS_TEST_POSTGRES_URL"

      # `uv sync --frozen` resolves against the lock and exits 0 even when
      # the lock contradicts pyproject.toml, installing the stale locked
      # version silently. Check for that drift explicitly first.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: ./lint.sh

      - name: Test
        run: uv run pytest python/tests -v

  docker:
    name: Docker
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: ./build.sh

      # The build above only proves the Dockerfiles compile; the images were
      # thrown away. This starts the service for real, which is the one check
      # that catches a startup fault — `cargo test` never runs main.
      #
      # ~15s on top of a job that already spends 151s building these images.
      - name: Service starts, migrates and serves
        run: |
          set -euo pipefail
          # Neutralise every peer address: 192.0.2.1 is TEST-NET-1 (RFC 5737)
          # and unroutable, so this makes no outbound connection. Rewriting the
          # committed config rather than keeping a second copy means it cannot
          # drift out of step with it.
          sed -E 's/^ip = \[.*\]/ip = [ "192.0.2.1" ]/' data/uaasr.docker.toml \
            > data/uaasr.smoke.toml
          # Fail loudly if the substitution missed one, rather than quietly
          # dialling a real node. Captured into a variable rather than tested
          # with `grep -q` in a pipeline, which is not portable across shells.
          offenders=$(grep -E '^ip = ' data/uaasr.smoke.toml | grep -v '192\.0\.2\.1' || true)
          if [ -n "$offenders" ]; then
            echo "a peer address was not neutralised:"
            echo "$offenders"
            exit 1
          fi

          # --wait blocks until uaas_backend reports healthy, and fails if
          # uaas_migrate exits non-zero, since the backend depends on it
          # completing successfully.
          docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
            -p uaas-smoke up -d --wait --wait-timeout 240 uaas_web

          echo "--- uaas_migrate ---"
          docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
            -p uaas-smoke logs uaas_migrate

          body=$(curl -sf --max-time 10 http://127.0.0.1:8081/health)
          echo "rust  /health -> $body"
          echo "$body" | grep -q '"status":"ok"'

          # The Python side, which is what CS-398 asks for. Meaningful only now
          # that it reads the database the indexer writes.
          web=$(curl -sf --max-time 10 http://127.0.0.1:5010/health)
          echo "python /health -> $web"

      # The step above only ever covers a *first* start: `down -v` drops the
      # volume, so every run migrates from nothing into an empty database. The
      # restart path had therefore never been exercised at all, which is how
      # CS-429 shipped — the service panicked decoding its own mempool rows and
      # died on every restart that had anything to load.
      #
      # A row, a restart, a health check. ~10s.
      - name: Service restarts against a database with data in it
        run: |
          set -euo pipefail
          # A synthetic mempool row, written with the same representation the
          # indexer uses: a 32-byte txid as raw bytea, not hex. Inserted rather
          # than indexed for real, because reaching a node is exactly what this
          # suite must not do.
          docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
            -p uaas-smoke exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U uaas -d uaas_db -c \
            "INSERT INTO mempool (hash, locktime, fee, tx)
             VALUES (decode(repeat('ab', 32), 'hex'), 0, 0, decode('deadbeef', 'hex'))
             ON CONFLICT (hash) DO NOTHING"

          rows=$(docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
            -p uaas-smoke exec -T postgres \
            psql -tA -U uaas -d uaas_db -c "SELECT count(*) FROM mempool")
          echo "mempool rows before restart: $rows"
          # Guard the guard: a restart over an empty table proves nothing.
          test "$rows" -ge 1

          docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
            -p uaas-smoke restart uaas_backend

          # The failure mode is a panic during startup, so poll rather than
          # assuming the process is up: without the fix it is already gone.
          for attempt in $(seq 1 20); do
            if curl -sf --max-time 5 http://127.0.0.1:8081/health > /dev/null; then
              echo "healthy after restart (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "service did not come back after restart with a non-empty mempool"
              docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
                -p uaas-smoke logs --no-color --tail 50 uaas_backend
              exit 1
            fi
            sleep 3
          done

          # Not a log assertion. `release_max_level_warn` compiles `info!` out
          # of release builds, so "Mempool tx Loaded" never reaches a container
          # log however well the load went — see docs on the log-level trap.
          #
          # RestartCount is the release-safe signal. The service is
          # `restart: on-failure`, and `docker compose restart` does not touch
          # this counter, so it stays 0 unless the process actually died and
          # the policy brought it back. With the CS-429 bug it climbs.
          restarts=$(docker inspect -f '{{.RestartCount}}' uaas_backend)
          echo "uaas_backend RestartCount: $restarts"
          test "$restarts" -eq 0

      - name: Smoke test teardown
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
            -p uaas-smoke logs --no-color uaas_backend uaas_web || true
          docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
            -p uaas-smoke down -v || true
