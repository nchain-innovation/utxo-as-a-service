name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
      # Inert: the service under test still runs on MariaDB. This exists so the
      # migration tests and `uaas migrate` run against the engine they target
      # rather than being skipped.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config mariadb-client postgresql-client

      - name: Initialize database
        run: |
          mariadb -h 127.0.0.1 -u root -pmysql < init_database/01_init.sql
          mariadb -h 127.0.0.1 -u root -pmysql main_uaas_db <<'EOF'
          CREATE TABLE IF NOT EXISTS orphans (
              height int unsigned not null,
              hash varchar(64) not null,
              version int unsigned not null,
              prev_hash varchar(64) not null,
              merkle_root varchar(64) not null,
              timestamp int unsigned not null,
              bits int unsigned not null,
              nonce int unsigned not null,
              created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          EOF

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: rust
        # --all-targets so test code is linted too; -D warnings so a finding
        # fails the build without relying on the RUSTFLAGS default that
        # setup-rust-toolchain happens to set.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        env:
          UAAS_TEST_MYSQL_URL: mysql://maas:maas-password@127.0.0.1:3306/main_uaas_db
          # Without this the migration tests skip rather than fail, which looks
          # identical to passing.
          UAAS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test

      # The tests call migrate::run directly. This runs the shipped binary end
      # to end, which is what a deploy actually does, and asserts the schema
      # version it leaves behind.
      - name: uaas migrate smoke test
        working-directory: rust
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -f ../init_database/postgres/01_roles_and_databases.sql
          cargo run --quiet -- migrate "postgresql://uaas:uaas-password@127.0.0.1:5432/uaas_db"
          version=$(psql "postgresql://uaas:uaas-password@127.0.0.1:5432/uaas_db" \
            -tAc "SELECT max(version) FROM schema_migration")
          echo "schema version: $version"
          test "$version" = "10"
          # A second run must be a no-op, not an error.
          cargo run --quiet -- migrate "postgresql://uaas:uaas-password@127.0.0.1:5432/uaas_db"

  python:
    name: Python
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Initialize database
        run: |
          mariadb -h 127.0.0.1 -u root -pmysql < init_database/01_init.sql
          mariadb -h 127.0.0.1 -u root -pmysql main_uaas_db <<'EOF'
          CREATE TABLE IF NOT EXISTS orphans (
              height int unsigned not null,
              hash varchar(64) not null,
              version int unsigned not null,
              prev_hash varchar(64) not null,
              merkle_root varchar(64) not null,
              timestamp int unsigned not null,
              bits int unsigned not null,
              nonce int unsigned not null,
              created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          EOF

      # `uv sync --frozen` resolves against the lock and exits 0 even when
      # the lock contradicts pyproject.toml, installing the stale locked
      # version silently. Check for that drift explicitly first.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: ./lint.sh

      - name: Test
        env:
          UAAS_TEST_MYSQL_URL: mysql://maas:maas-password@127.0.0.1:3306/main_uaas_db
        run: uv run pytest python/tests -v

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: ./build.sh
