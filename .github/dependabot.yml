version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # `uv`, not `pip`: the pip ecosystem edits pyproject.toml but does not
  # understand uv.lock, so the two drift and `uv sync --frozen` silently
  # installs the stale locked version. The uv ecosystem updates both in
  # the same PR. See the `uv lock --check` step in ci.yml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
