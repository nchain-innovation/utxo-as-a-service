# Overrides for the startup smoke test, used by CI and runnable by hand:
#
#   sed -E 's/^ip = \[.*\]/ip = [ "192.0.2.1" ]/' data/uaasr.docker.toml \
#     > data/uaasr.smoke.toml
#   docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
#     -p uaas-smoke up -d --wait uaas_web
#   curl -sf http://127.0.0.1:8081/health && curl -sf http://127.0.0.1:5010/health
#   docker compose -f docker-compose.yml -f docker/ci/compose.smoke.yml \
#     -p uaas-smoke down -v
#
# Naming uaas_web brings up postgres, uaas_migrate and uaas_backend with it —
# the whole stack bar adminer, which is a GUI and has nothing to assert.
services:
  postgres:
    # A named volume rather than the ./data/postgres bind mount, so `down -v`
    # actually removes it and each run starts from an empty data directory —
    # which is also the only condition under which the roles-and-databases init
    # script runs at all.
    volumes:
      - smoke_pgdata:/var/lib/postgresql/data
      - ./init_database/postgres:/docker-entrypoint-initdb.d/:ro

  # Both services read the same config, and the peer address in it is
  # unroutable, so the stack starts, migrates and serves without reaching any
  # real node. Startup is what is under test here, not block download.
  uaas_backend:
    volumes:
      - ./data/uaasr.smoke.toml:/app/data/uaasr.toml:ro

  uaas_web:
    volumes:
      - ./python/src:/app/python
      - ./data:/app/data
      - ./data/uaasr.smoke.toml:/app/data/uaasr.toml:ro

volumes:
  smoke_pgdata:
