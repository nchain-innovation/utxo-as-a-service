
networks:
  uaas_network:
    external: false
    name: uaas_network

services:
  # Database (MariaDB — MySQL-compatible, multi-arch including Apple Silicon)
  database:
    container_name: uaas_database
    image: mariadb:11.4
    cap_add:
      - SYS_NICE
    restart: always
    ports:
      - "3307:3306"
    networks:
      - uaas_network
    environment:
        # Sourced from a local .env file (see .env.example); falls back to the
        # historical default so existing dev setups keep working.
        MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-mysql}
        MARIADB_DATABASE: db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
        - ./data/mysql:/var/lib/mysql
        - ./init_database:/docker-entrypoint-initdb.d/:ro
        - ./docker/mariadb/99-uaas.cnf:/etc/mysql/mariadb.conf.d/99-uaas.cnf:ro

  # PostgreSQL — the Rust service's data store. The Python web API still reads
  # MariaDB below, so until that is swapped over it serves stale data.
  postgres:
    container_name: uaas_postgres
    image: postgres:17
    restart: always
    ports:
      - "5433:5432"
    networks:
      - uaas_network
    environment:
      # Local development only, same as the MariaDB credentials above.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # Roles and databases only. The schema is applied by `uaas migrate`,
      # because anything mounted here runs only on an empty data directory and
      # so can never evolve a database that already exists.
      - ./init_database/postgres:/docker-entrypoint-initdb.d/:ro

  # Basic GUI for interacting with database
  adminer:
    container_name: uaas_db_admin
    image: adminer
    restart: always
    depends_on:
      database:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 8080:8080
    networks:
      - uaas_network

  # Schema migration — runs to completion, then exits.
  #
  # A separate one-shot service rather than something folded into the backend's
  # entrypoint, because that is the shape a deploy wants: migrate once, then
  # start however many service replicas. The backend refuses to start against a
  # schema version it does not recognise, so this has to succeed first.
  #
  # The init script mounted into the postgres container creates roles and
  # databases only; it can never apply the schema, because anything in
  # /docker-entrypoint-initdb.d/ runs only on an empty data directory.
  uaas_migrate:
    container_name: uaas_migrate
    image: uaas-service
    networks:
      - uaas_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `uaas migrate` reads this when given no URL argument. Local development
      # credentials, the same ones in data/uaasr.docker.toml.
      UAAS_POSTGRES_URL: ${UAAS_POSTGRES_URL:-postgresql://uaas:uaas-password@postgres:5432/uaas_db}
    command: ["/app/bin/uaas", "migrate"]
    # One shot: a restart policy would re-run it on every exit.
    restart: "no"

  # UaaS backend
  uaas_backend:
    container_name: uaas_backend
    image: uaas-service
    ports:
      - "8081:8081"
    networks:
      - uaas_network
    depends_on:
      postgres:
        condition: service_healthy
      uaas_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./data:/app/data
      - ./data/uaasr.docker.toml:/app/data/uaasr.toml:ro
    restart: on-failure

  # UaaS web API — still on MariaDB, which nothing writes to any more, so its
  # responses are stale until the Python data layer is swapped over too.
  uaas_web:
    container_name: uaas_web
    image: uaas-web
    ports:
      - "5010:5010"
    networks:
      - uaas_network
    depends_on:
      database:
        condition: service_healthy
      uaas_backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5010/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./python/src:/app/python
      - ./data:/app/data
      - ./data/uaasr.docker.toml:/app/data/uaasr.toml:ro
    restart: on-failure
