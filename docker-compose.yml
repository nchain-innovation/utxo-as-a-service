
networks:
  uaas_network:
    external: false
    name: uaas_network

services:
  # PostgreSQL — the one database. Both components read and write it.
  postgres:
    container_name: uaas_postgres
    image: postgres:17
    restart: always
    ports:
      - "5433:5432"
    networks:
      - uaas_network
    environment:
      # Local development only, as documented in docs/Security.md.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # Roles and databases only. The schema is applied by `uaas migrate`,
      # because anything mounted here runs only on an empty data directory and
      # so can never evolve a database that already exists.
      - ./init_database/postgres:/docker-entrypoint-initdb.d/:ro

  # Basic GUI for interacting with database
  adminer:
    container_name: uaas_db_admin
    image: adminer
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8080:8080
    networks:
      - uaas_network

  # Schema migration — runs to completion, then exits.
  #
  # A separate one-shot service rather than something folded into the backend's
  # entrypoint, because that is the shape a deploy wants: migrate once, then
  # start however many service replicas. The backend refuses to start against a
  # schema version it does not recognise, so this has to succeed first.
  #
  # The init script mounted into the postgres container creates roles and
  # databases only; it can never apply the schema, because anything in
  # /docker-entrypoint-initdb.d/ runs only on an empty data directory.
  uaas_migrate:
    container_name: uaas_migrate
    image: uaas-service
    networks:
      - uaas_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `uaas migrate` reads this when given no URL argument. Local development
      # credentials, the same ones in data/uaasr.docker.toml.
      UAAS_POSTGRES_URL: ${UAAS_POSTGRES_URL:-postgresql://uaas:uaas-password@postgres:5432/uaas_db}
    command: ["/app/bin/uaas", "migrate"]
    # One shot: a restart policy would re-run it on every exit.
    restart: "no"

  # UaaS backend
  uaas_backend:
    container_name: uaas_backend
    image: uaas-service
    ports:
      - "8081:8081"
    networks:
      - uaas_network
    depends_on:
      postgres:
        condition: service_healthy
      uaas_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      # The tracked configs carry a CHANGE-ME placeholder, so the URL has to
      # come from here. Local development credentials for the throwaway
      # postgres container in this file, matching the roles created by
      # init_database/postgres/01_roles_and_databases.sql.
      UAAS_POSTGRES_URL: ${UAAS_POSTGRES_URL:-postgresql://uaas:uaas-password@postgres:5432/uaas_db}
    volumes:
      - ./data:/app/data
      - ./data/uaasr.docker.toml:/app/data/uaasr.toml:ro
    restart: on-failure

  # UaaS web API
  uaas_web:
    container_name: uaas_web
    image: uaas-web
    ports:
      - "5010:5010"
    networks:
      - uaas_network
    depends_on:
      postgres:
        condition: service_healthy
      uaas_migrate:
        condition: service_completed_successfully
      uaas_backend:
        condition: service_healthy
    environment:
      # The tracked configs carry a CHANGE-ME placeholder, so the URL has to
      # come from here. Local development credentials for the throwaway
      # postgres container in this file, matching the roles created by
      # init_database/postgres/01_roles_and_databases.sql.
      UAAS_POSTGRES_URL: ${UAAS_POSTGRES_URL:-postgresql://uaas:uaas-password@postgres:5432/uaas_db}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5010/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./python/src:/app/python
      - ./data:/app/data
      - ./data/uaasr.docker.toml:/app/data/uaasr.toml:ro
    restart: on-failure
